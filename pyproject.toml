[tool.poetry]
name = "auto-playwright"
version = "0.1.0"
description = "Automate Playwright tests using ChatGPT."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://ray.run"
repository = "https://github.com/lucgagan/auto-playwright"
keywords = ["openai", "playwright", "test"]
packages = [{include = "auto_playwright", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
playwright = "^1.39.0"
openai = "^1.3.0"
beautifulsoup4 = "^4.12.2"
flask = "^3.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-playwright = "^0.4.3"
black = "^23.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"